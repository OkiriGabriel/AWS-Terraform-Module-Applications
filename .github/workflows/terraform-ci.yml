name: Terraform CI

# Runs on every push to any branch, on every pull request, and on demand.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.15.8 # version the test suite is verified on (mocked tests need >= 1.7)
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  # ------------------------------------------------------------------ format + lint
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - uses: terraform-linters/setup-tflint@v4

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # avoids GitHub API rate limits when downloading plugins
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact --minimum-failure-severity=error

      - name: Module structure
        run: |
          for module_dir in modules/*/; do
            for f in main.tf variables.tf outputs.tf; do
              [ -f "$module_dir$f" ] || { echo "::error::Missing $f in $module_dir"; exit 1; }
            done
            echo "ok $module_dir"
          done

  # ------------------------------------------------------------------ init + validate
  validate:
    name: Init and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/versions.tf', 'examples/**/main.tf') }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Validate root module
        run: |
          terraform init -backend=false
          terraform validate -no-color

      - name: Validate organization module
        working-directory: modules/organization
        run: |
          terraform init -backend=false
          terraform validate -no-color

      - name: Validate examples
        run: |
          for e in examples/*/; do
            echo "::group::$e"
            (cd "$e" && terraform init -backend=false >/dev/null && terraform validate -no-color)
            echo "::endgroup::"
          done

  # ------------------------------------------------------------------ tests
  test:
    name: Tests (mocked AWS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/versions.tf', 'examples/**/main.tf') }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # Every profile end-to-end plus each guardrail, against a mocked provider:
      # no AWS credentials, nothing is created, no cost.
      - name: Platform module tests
        run: |
          terraform init -backend=false
          terraform test -no-color

      - name: Organization guardrail tests
        working-directory: modules/organization
        run: |
          terraform init -backend=false
          terraform test -no-color

  # ------------------------------------------------------------------ secrets
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the latest commit

      # Open-source Gitleaks CLI: free for personal and organization repos (the GitHub Action needs a
      # license key for organizations). Pinned version, checksum-verified.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # ------------------------------------------------------------------ IaC security
  security:
    name: IaC Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Results are printed in this job's log. No upload to GitHub code scanning, so no
      # GitHub Advanced Security features are used.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          skip_path: tests,examples
          soft_fail: true # report findings without failing; set false to block merges on findings
          output_format: cli

  # ------------------------------------------------------------------ single required check
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, validate, test, secrets, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "lint=${{ needs.lint.result }} validate=${{ needs.validate.result }} test=${{ needs.test.result }} secrets=${{ needs.secrets.result }} security=${{ needs.security.result }}"
          exit 1

      - name: All checks green
        run: echo "All CI jobs passed."
