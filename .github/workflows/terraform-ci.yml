name: Terraform Validation

on:
  pull_request:
    branches:
      - main
      - development
      - staging
  push:
    branches:
      - main
      - development
      - staging

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment results on PRs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8 # version the test suite is verified on (mocks need >= 1.7)

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init (module)
        id: init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate (module)
        id: validate
        run: terraform validate -no-color

      # Runs every profile end-to-end and checks each guardrail against a mocked AWS provider.
      # No AWS credentials needed, nothing is created.
      - name: Terraform Test (module)
        id: test
        run: terraform test -no-color

      - name: Terraform Test (organization guardrails)
        working-directory: modules/organization
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Validate examples
        run: |
          for e in examples/*/; do
            echo "::group::$e"
            (cd "$e" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
            echo "::endgroup::"
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact --minimum-failure-severity=error

      - name: Validate Module Structure
        run: |
          for module_dir in modules/*/; do
            for f in main.tf variables.tf outputs.tf; do
              if [ ! -f "$module_dir$f" ]; then
                echo "❌ Missing $f in $module_dir"; exit 1
              fi
            done
            echo "✅ $module_dir"
          done

      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Test 🧪\`${{ steps.test.outcome }}\`

            *Pusher: ${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: IaC Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub code scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true # report findings in the Security tab without blocking merges
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov
